<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neutrix | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('neutrix_authenticated') !== 'true') {
            window.location.href = 'signin.html';
        }
    </script>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <p style="text-align: right;">
            <a href="#" onclick="localStorage.removeItem('neutrix_authenticated'); window.location.reload();" style="color: #dc3545; font-weight: bold;">🚪 Sign Out</a>
        </p>
        <header style="border-bottom: 2px solid #ced4da; padding-bottom: 15px; margin-bottom: 20px;">
            <h1>⚡ Neutrix Dashboard</h1>
            <p class="caption">Welcome Back, <span id="welcomePatientName" style="color:#0d6efd; font-weight:bold;">User</span>! 👋 — Small signals. Clear recovery.</p>
        </header>
        <main>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px;">
                <a href="summary.html" style="display:block; padding:15px; background:#e3f2fd; color:#0d6efd; text-decoration:none; border-radius:4px; font-weight:bold; text-align:center;">🧠 AI Discharge Summary (Ajay)</a>
                <a href="upload.html" style="display:block; padding:15px; background:#e3f2fd; color:#0d6efd; text-decoration:none; border-radius:4px; font-weight:bold; text-align:center;">📄 Upload Records (Lingesh)</a>
                <a href="medicine.html" style="display:block; padding:15px; background:#e3f2fd; color:#0d6efd; text-decoration:none; border-radius:4px; font-weight:bold; text-align:center;">💊 Medicine Plan (Lingesh)</a>
                <a href="tracker.html" style="display:block; padding:15px; background:#e3f2fd; color:#0d6efd; text-decoration:none; border-radius:4px; font-weight:bold; text-align:center;">📈 Recovery Tracker (Bobby)</a>
                <a href="warnings.html" style="display:block; padding:15px; background:#e3f2fd; color:#0d6efd; text-decoration:none; border-radius:4px; font-weight:bold; text-align:center;">⚠️ Warning Signs Triage (Bobby)</a>
                <a href="brief.html" style="display:block; padding:15px; background:#e3f2fd; color:#0d6efd; text-decoration:none; border-radius:4px; font-weight:bold; text-align:center;">🧑‍⚕️ Doctor Communication Brief (Bobby)</a>
            </div>
        </main>
    </div>
    <script>
        const name = localStorage.getItem('neutrix_patient_name') || "User";
        document.getElementById('welcomePatientName').innerText = name;
    </script>
</body>
</html>
