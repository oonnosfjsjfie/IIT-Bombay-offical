<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutrix | AI Medical Assistant</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="pages.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body data-page="upload" data-title-key="pageTitle">

    <nav class="ehr-navbar">
        <div class="nav-container">
            <div class="hospital-brand">
                <div class="cross-icon">+</div>
                <div class="brand-text">
                    <span class="brand-title">NEUTRIX HEALTH</span>
                    <span class="brand-sub" data-i18n="brandSub">Post-Discharge Patient Portal</span>
                </div>
            </div>
            <div class="system-controls">
                <a class="ctrl-btn nav-link hidden" data-nav="upload" href="summary.html" data-i18n="navUpload">🏠 Upload</a>
                <a class="ctrl-btn nav-link hidden" data-nav="report" href="report.html" data-i18n="navReport">📋 Summary</a>
                <a class="ctrl-btn nav-link hidden" data-nav="schedule" href="schedule.html" data-i18n="navSchedule">💊 My Schedule</a>
                <button class="ctrl-btn" id="themeToggle" type="button">🌙 Dark Mode</button>
                <button class="ctrl-btn" id="langToggle" type="button">🌐 മലയാളം</button>
            </div>
        </div>
    </nav>

    <main class="ehr-workspace">

        <section class="ehr-card">
            <div class="card-header">
                <div>
                    <h2 data-i18n="cardTitle">🧠 AI Report Explainer</h2>
                    <p class="subtitle" data-i18n="cardSubtitle"></p>
                </div>
                <span class="form-status" data-i18n="beta">Beta</span>
            </div>

            <div class="section-title" data-i18n="uploadSection">Upload Reports</div>

            <!-- Medical reports (one or more) -->
            <div class="form-group">
                <label><span data-i18n="fileLabel">Medical Reports (PDF)</span> <span class="req">*</span></label>
                <input type="file" id="pdfFile" accept=".pdf,application/pdf" class="hidden-file-input" multiple>
                <div id="pdfList" class="file-list"></div>
                <div id="pdfDropZone" class="drop-zone" tabindex="0" role="button">
                    <div class="drop-icon">📄</div>
                    <div class="drop-title" data-i18n-html="dropTitle"></div>
                    <div class="drop-sub" data-i18n="dropSub"></div>
                </div>
            </div>

            <!-- Pharmacy bills (optional, one or more) -->
            <div class="form-group">
                <label data-i18n="billLabel">Pharmacy Bills (PDF, optional)</label>
                <input type="file" id="billFile" accept=".pdf,application/pdf" class="hidden-file-input" multiple>
                <div id="billList" class="file-list"></div>
                <div id="billDropZone" class="drop-zone" tabindex="0" role="button">
                    <div class="drop-icon">🧾</div>
                    <div class="drop-title" data-i18n-html="billDropTitle"></div>
                    <div class="drop-sub" data-i18n="billDropSub"></div>
                </div>
            </div>

            <p class="hint lang-hint" data-i18n-html="langHint"></p>

            <button id="processBtn" class="btn-primary" data-i18n="processBtn">Explain My Report</button>
            <button id="openLastBtn" class="btn-secondary hidden" type="button" data-i18n="lastSummary"></button>

            <div id="statusIndicator" style="margin-top: 16px;"></div>

            <!-- Fallback box (only used if the summary page can't be opened) -->
            <div id="resultOutput" class="output-block ai hidden">
                <h3 class="block-title" data-i18n="summaryTitle"></h3>
                <div id="aiTextResponse" class="output-text md-content"></div>
            </div>
        </section>

        <aside class="ehr-card chart-card">
            <div class="chart-header">
                <h3 data-i18n="howTitle">HOW IT WORKS</h3>
                <span class="mrn-badge">V1</span>
            </div>

            <ol class="info-list">
                <li data-i18n="step1"></li>
                <li data-i18n="step2"></li>
                <li data-i18n-html="step3"></li>
                <li data-i18n="step4"></li>
            </ol>

            <div class="chart-divider"></div>

            <div class="caregiver-alert-box">
                <div class="caregiver-name" data-i18n="labelTitle"></div>
                <div class="caregiver-phone" data-i18n="labelText"></div>
            </div>

            <footer class="ehr-disclaimer">
                <p data-i18n-html="notice"></p>
            </footer>
        </aside>

    </main>

    <script src="common.js"></script>
    <script>
        // ----- Multi-file uploaders (reports + bills) -----
        window.neutrixUploads = { pdf: [], bill: [] };

        function formatSize(bytes) {
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function setupUploader(prefix, onChange) {
            const files = window.neutrixUploads[prefix];
            const input = document.getElementById(prefix + 'File');
            const zone = document.getElementById(prefix + 'DropZone');
            const list = document.getElementById(prefix + 'List');

            function render() {
                list.innerHTML = '';
                files.forEach((file, index) => {
                    const chip = document.createElement('div');
                    chip.className = 'file-chip';

                    const icon = document.createElement('div');
                    icon.className = 'file-chip-icon';
                    icon.textContent = 'PDF';

                    const info = document.createElement('div');
                    info.className = 'file-chip-info';
                    const name = document.createElement('div');
                    name.className = 'file-chip-name';
                    name.textContent = file.name;
                    const size = document.createElement('div');
                    size.className = 'file-chip-size';
                    size.textContent = formatSize(file.size);
                    info.append(name, size);

                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'btn-remove';
                    remove.dataset.i18n = 'removeBtn';
                    remove.textContent = t('removeBtn');
                    remove.addEventListener('click', () => {
                        files.splice(index, 1);
                        showStatus(null);
                        render();
                        if (onChange) onChange();
                    });

                    chip.append(icon, info, remove);
                    list.appendChild(chip);
                });
                zone.classList.toggle('compact', files.length > 0);
            }

            function addFiles(fileList) {
                let rejected = false;
                for (const file of fileList) {
                    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                    if (!isPdf) {
                        rejected = true;
                        continue;
                    }
                    const duplicate = files.some(f => f.name === file.name && f.size === file.size);
                    if (!duplicate) files.push(file);
                }
                if (rejected) showStatus('warning', 'onlyPdf');
                else showStatus(null);
                render();
                if (onChange) onChange();
            }

            zone.addEventListener('click', () => input.click());
            zone.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    input.click();
                }
            });
            input.addEventListener('change', () => {
                addFiles(input.files);
                input.value = '';   // allows choosing the same file again after removing it
            });

            ['dragenter', 'dragover'].forEach(evt => {
                zone.addEventListener(evt, (e) => {
                    e.preventDefault();
                    zone.classList.add('dragover');
                });
            });
            ['dragleave', 'drop'].forEach(evt => {
                zone.addEventListener(evt, (e) => {
                    e.preventDefault();
                    zone.classList.remove('dragover');
                });
            });
            zone.addEventListener('drop', (e) => {
                if (e.dataTransfer.files.length > 0) addFiles(e.dataTransfer.files);
            });

            render();
        }

        setupUploader('pdf', () => {
            document.getElementById('resultOutput').classList.add('hidden');
            document.getElementById('aiTextResponse').innerHTML = '';
        });
        setupUploader('bill');
    </script>
    <script src="summary.js"></script>
    <script src="chat.js"></script>
</body>
</html>
