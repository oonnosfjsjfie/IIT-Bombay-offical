<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neutrix | Sign In</title>
    <link rel="stylesheet" href="style.css"> <!-- Reuses your core application styling -->
</head>
<body>
    <div class="container" style="max-width: 400px; margin: 100px auto;">
        <div style="text-align: center; margin-bottom: 25px;">
            <h1>⚡ Neutrix</h1>
            <p class="caption">Secure Portal Access</p>
        </div>

        <form id="loginForm">
            <label for="userEmail">Email Address</label>
            <input type="email" id="userEmail" placeholder="name@domain.com" required>

            <label for="userPassword">Password</label>
            <input type="password" id="userPassword" placeholder="••••••••" required>

            <button type="submit" style="margin-top: 25px;">Sign In</button>
        </form>

        <div id="loginFeedback"></div>

        <footer class="disclaimer" style="text-align: center; margin-top: 30px;">
            <p>Protected by Neutrix Core Security Layouts.</p>
        </footer>
    </div>
    <script src="signin.js"></script>
</body>
</html>
