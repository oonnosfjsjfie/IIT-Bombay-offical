<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neutrix | Ingest Records</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📄 Ingest Medical Records</h1>
        <p class="caption">Upload a medical record file to activate parsing frameworks.</p>
        <input type="file" id="docUploadInput" accept=".pdf">
        <button id="extractBtn">Extract Text Layers & Connect Dosing Matrix</button>
        <div id="uploadStatus"></div>
        <div id="extractionResults" class="hidden" style="margin-top: 25px;">
            <h3>Extracted Text Pipeline</h3>
            <textarea id="extractedTextDisplay" rows="12" style="font-family: monospace;"></textarea>
            <button id="downloadTxtBtn" style="background-color: #198754;">Download Text File (.txt)</button>
        </div>
        <p style="margin-top:20px;"><a href="index.html">← Back to Dashboard</a></p>
    </div>
    <script src="upload.js"></script>
</body>
</html>
